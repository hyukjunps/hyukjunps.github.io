name: Apply Korean O.Poong SEO alias

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seo-korean-alias.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Korean brand signals to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = [
              (r'<title>.*?</title>', '<title>오풍(O.Poong) | 풍산고 생활, 한 화면에서</title>'),
              (r'<meta name="application-name"[^>]*>', '<meta name="application-name" content="O.Poong (오풍)" />'),
              (r'<meta name="description"[^>]*>', '<meta name="description" content="오풍(O.Poong)은 안동 풍산고등학교 생활 정보를 한 화면에서 확인하는 학생용 웹 서비스입니다. 급식, 학사일정, 시간표, 날씨 등 학교생활 정보를 빠르게 확인하세요." />'),
              (r'<meta name="keywords"[^>]*>', '<meta name="keywords" content="오풍, O.Poong, 풍산고, 풍산고등학교, 급식, 학사일정, 시간표, 날씨" />'),
              (r'<meta property="og:site_name"[^>]*>', '<meta property="og:site_name" content="오풍(O.Poong)" />'),
              (r'<meta property="og:title"[^>]*>', '<meta property="og:title" content="오풍(O.Poong) | 풍산고 생활, 한 화면에서" />'),
              (r'<meta property="og:description"[^>]*>', '<meta property="og:description" content="오풍(O.Poong)에서 풍산고 급식, 학사일정, 시간표, 날씨 등 학교생활 정보를 확인하세요." />'),
          ]
          for pattern, replacement in replacements:
              s, _ = re.subn(pattern, replacement, s, count=1, flags=re.S)

          if 'property="og:url"' not in s:
              s = s.replace('<meta property="og:type" content="website" />', '<meta property="og:type" content="website" />\n<meta property="og:url" content="https://hyukjunps.github.io/" />', 1)

          if 'rel="canonical"' not in s:
              s = s.replace('<link rel="manifest" href="./manifest.json" />', '<link rel="canonical" href="https://hyukjunps.github.io/" />\n<link rel="manifest" href="./manifest.json" />', 1)

          if 'id="opoong-site-schema"' not in s:
              schema = '''\n<script id="opoong-site-schema" type="application/ld+json">\n{\n  "@context": "https://schema.org",\n  "@type": "WebSite",\n  "url": "https://hyukjunps.github.io/",\n  "name": "O.Poong",\n  "alternateName": ["오풍", "Opoong", "O Poong"],\n  "inLanguage": "ko-KR",\n  "description": "풍산고등학교 생활 정보를 한 화면에서 확인할 수 있는 학생용 웹 서비스"\n}\n</script>\n'''
              s = s.replace('<link rel="apple-touch-icon" href="./O.poong.png" />', '<link rel="apple-touch-icon" href="./O.poong.png" />' + schema, 1)

          s = s.replace('<div class="logoWrap" aria-label="O.Poong 홈 로고">', '<div class="logoWrap" aria-label="오풍 O.Poong 홈 로고">', 1)
          s = s.replace('alt="O.Poong 로고"', 'alt="오풍 O.Poong 로고"', 1)
          s = s.replace('<b>O.Poong</b>\n        <span>풍산고 생활, 한 화면에서.</span>', '<b>O.Poong</b>\n        <span>오풍 · 풍산고 생활, 한 화면에서.</span>', 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit homepage SEO changes
        run: |
          if git diff --quiet -- index.html; then
            echo "Homepage SEO already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "seo: add Korean O.Poong brand signals"
          git push
