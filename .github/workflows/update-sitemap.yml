name: Update sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - sitemap.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild sitemap from current routes
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          today = datetime.now(timezone.utc).date().isoformat()

          match = re.search(r'const\s+allowed\s*=\s*\[(.*?)\]\s*;', html, re.S)
          if match:
              pages = re.findall(r'["\']([A-Za-z0-9_-]+)["\']', match.group(1))
          else:
              pages = re.findall(r'href=["\']/\?page=([A-Za-z0-9_-]+)', html)

          pages = list(dict.fromkeys(pages))
          pages = [p for p in pages if p != 'home']

          settings = {
              'weather': ('daily', '0.85'),
              'meal': ('daily', '0.90'),
              'schedule': ('daily', '0.90'),
              'timetable': ('weekly', '0.80'),
              'focus': ('weekly', '0.60'),
              'game': ('weekly', '0.50'),
              'onway': ('monthly', '0.55'),
              'school': ('monthly', '0.55'),
              'library': ('weekly', '0.70'),
              'policy': ('monthly', '0.50'),
              'about': ('monthly', '0.65'),
          }

          urls = [('/', 'daily', '1.0')]
          for page in pages:
              freq, priority = settings.get(page, ('weekly', '0.60'))
              urls.append((f'/?page={page}', freq, priority))

          if Path('seo/opoong.html').exists():
              urls.append(('/seo/opoong.html', 'monthly', '0.60'))

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]
          for path, freq, priority in urls:
              loc = 'https://hyukjunps.github.io' + path
              lines += [
                  '  <url>',
                  f'    <loc>{loc}</loc>',
                  f'    <lastmod>{today}</lastmod>',
                  f'    <changefreq>{freq}</changefreq>',
                  f'    <priority>{priority}</priority>',
                  '  </url>'
              ]
          lines.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "No sitemap changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: rebuild sitemap from current routes"
          git push
