name: Update sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - sitemap.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh sitemap lastmod
        run: |
          TODAY=$(date -u +%F)
          sed -E -i "s#<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>#<lastmod>${TODAY}</lastmod>#g" sitemap.xml

      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "No sitemap changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: refresh sitemap lastmod"
          git push
