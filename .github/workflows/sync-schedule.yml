name: Sync school schedule

on:
  push:
    paths:
      - ".github/workflows/sync-schedule.yml"
      - "scripts/sync_school_schedule.py"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-school-schedule
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch official school schedule
        run: python scripts/sync_school_schedule.py --past 2 --future 12

      - name: Commit updated schedule data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule/*.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update school schedule data"
            git push
          fi
