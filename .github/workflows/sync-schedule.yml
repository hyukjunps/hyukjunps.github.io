name: Sync school schedule

on:
  push:
    paths:
      - ".github/workflows/sync-schedule.yml"
      - "scripts/sync_school_schedule.py"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-school-schedule
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch official school schedule
        run: python scripts/sync_school_schedule.py --past 12 --future 12

      - name: Validate schedule data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def looks_broken(title):
              return any(
                  0x80 <= ord(char) <= 0x9F
                  or 0x400 <= ord(char) <= 0x4FF
                  or 0x4E00 <= ord(char) <= 0x9FFF
                  or ord(char) == 0xFFFD
                  for char in title
              )

          files = sorted(Path("data/schedule").glob("*.json"))
          if not files:
              raise SystemExit("No schedule JSON files were generated")

          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              if not data.get("ok") or data.get("ym") != path.stem:
                  raise ValueError(f"Invalid schedule metadata: {path}")
              titles = [
                  item.get("title", "")
                  for items in data.get("byDate", {}).values()
                  for item in items
              ]
              broken = [title for title in titles if looks_broken(title)]
              if broken:
                  raise ValueError(f"Mojibake detected in {path}: {broken[:3]}")
          print(f"Validated {len(files)} schedule files")
          PY

      - name: Commit updated schedule data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule/*.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update school schedule data"
            git push
          fi
