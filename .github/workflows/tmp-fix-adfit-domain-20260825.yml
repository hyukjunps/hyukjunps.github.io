name: One-time AdFit domain migration

on:
  push:
    branches:
      - fix/adfit-kakaocdn-sdk

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/adfit-kakaocdn-sdk
          fetch-depth: 0

      - name: Replace deprecated AdFit SDK domain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://t1.daumcdn.net/kas/static/ba.min.js?'
          new = 'https://t1.kakaocdn.net/kas/static/ba.min.js?'
          if old not in s:
              raise SystemExit('Deprecated AdFit SDK URL not found')
          s = s.replace(old, new)
          if 't1.daumcdn.net' in s:
              raise SystemExit('Another deprecated daumcdn AdFit reference remains')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-fix-adfit-domain-20260825.yml

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .github/workflows/tmp-fix-adfit-domain-20260825.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix deprecated AdFit SDK domain'
          git push origin HEAD:fix/adfit-kakaocdn-sdk
