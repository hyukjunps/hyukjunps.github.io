name: One-time O.Poong focus cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-focus-points-links.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove focus and points, add learning links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          classroom = '        <a class="navBtn" href="https://classroom.google.com/" target="_blank" rel="noopener noreferrer"><span class="left"><span class="icon">클</span><span><span class="title">Google Classroom</span><br><span class="hint">수업·과제 바로가기</span></span></span><span>↗</span></a>'
          ebsi = '        <a class="navBtn" href="https://www.ebsi.co.kr/" target="_blank" rel="noopener noreferrer"><span class="left"><span class="icon">E</span><span><span class="title">EBSi</span><br><span class="hint">고교강의 바로가기</span></span></span><span>↗</span></a>'

          # Replace the Focus menu with two learning shortcuts.
          s, n = re.subn(
              r'\n\s*<a class="navBtn" data-view="focus"[^\n]*?</a>',
              '\n' + classroom + '\n' + ebsi,
              s,
              count=1,
          )
          if n == 0 and 'https://classroom.google.com/' not in s:
              timetable = re.search(r'(^\s*<a class="navBtn" data-view="timetable"[^\n]*?</a>)', s, re.M)
              if not timetable:
                  raise SystemExit('Could not find timetable menu anchor')
              s = s[:timetable.end()] + '\n' + classroom + '\n' + ebsi + s[timetable.end():]

          # Remove Focus page and full-screen focus overlay entirely.
          s, n = re.subn(
              r'\n\s*<section class="section view" id="view-focus">.*?(?=\n\s*<section class="section view" id="view-onway">)',
              '\n\n',
              s,
              count=1,
              flags=re.S,
          )
          if n == 0 and 'id="view-focus"' in s:
              raise SystemExit('Could not remove focus view')

          # Remove hidden developer points modal.
          s = re.sub(
              r'\n<div id="adminPointBack".*?</section>\s*</div>\s*(?=\n<script>)',
              '\n',
              s,
              count=1,
              flags=re.S,
          )

          # Remove Focus from global search.
          s = re.sub(r'\n\s*\{title:"집중 모드"[^\n]*\},', '', s, count=1)

          # Stop initializing Focus/points systems.
          s = s.replace('  initAdminPointMode();\n', '')
          s = s.replace('  initFocusTracker();\n', '')

          # Disable the old hidden logo-triggered point admin entry.
          s = s.replace('id="adminLogoTrigger" class="logoWrap" role="button" tabindex="0" aria-label="O.Poong 홈 로고"', 'class="logoWrap" aria-label="O.Poong 홈 로고"', 1)

          # Old direct links such as ?page=focus now safely go home.
          if 'function go(view){' in s and 'if(view === "focus") view = "home";' not in s:
              s = s.replace('function go(view){', 'function go(view){\n  if(view === "focus") view = "home";', 1)

          path.write_text(s, encoding='utf-8')
          PY

          # Remove this one-time workflow after it has done its job.
          rm -f .github/workflows/cleanup-focus-points-links.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/cleanup-focus-points-links.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Remove focus mode and points; add Classroom and EBSi"
          git push
