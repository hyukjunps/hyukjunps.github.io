name: Build O.Poong widgets

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-widgets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: O.Poong-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app and widget for the iOS simulator
        working-directory: mobile/ios
        run: xcodebuild -project OPoong.xcodeproj -scheme OPoong -configuration Debug -derivedDataPath "$RUNNER_TEMP/opoong-ios" -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Package the iOS simulator app
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/opoong-ios/Build/Products/Debug-iphonesimulator/OPoong.app" "$RUNNER_TEMP/OPoong-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: O.Poong-iOS-Simulator
          path: ${{ runner.temp }}/OPoong-iOS-Simulator.zip
          if-no-files-found: error
