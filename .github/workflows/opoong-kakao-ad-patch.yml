name: O.Poong Kakao ad patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/opoong-kakao-ad-patch.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Kakao AdFit units
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = {
              '<div class="adfitWrap adfitMobile homeTopMobile" id="ad-home-mobile" aria-label="광고"></div>': '''<div class="adfitWrap adfitMobile homeTopMobile" id="ad-home-mobile" aria-label="광고">
            <ins class="kakao_ad_area" style="display:none;"
              data-ad-unit="DAN-rJlK5gWdIDLwSy9f"
              data-ad-width="320"
              data-ad-height="100"></ins>
          </div>''',
              '<div class="adfitWrap adfitMobile" id="ad-meal" aria-label="광고"></div>': '''<div class="adfitWrap adfitMobile" id="ad-meal" aria-label="광고">
          <ins class="kakao_ad_area" style="display:none;"
            data-ad-unit="DAN-mrfQcLgptQsCE1ci"
            data-ad-width="320"
            data-ad-height="50"></ins>
        </div>''',
              '<div class="adfitWrap adfitMobile" id="ad-onway" aria-label="광고"></div>': '''<div class="adfitWrap adfitMobile" id="ad-onway" aria-label="광고">
          <ins class="kakao_ad_area" style="display:none;"
            data-ad-unit="DAN-YjOdZeyzOy7YEylv"
            data-ad-width="320"
            data-ad-height="100"></ins>
        </div>''',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected ad placeholder not found: {old}")
              text = text.replace(old, new, 1)

          loader = '<script type="text/javascript" src="//t1.kakaocdn.net/kas/static/ba.min.js" async></script>\n\n'
          anchor = '<script>\n/* ========================='
          if 't1.kakaocdn.net/kas/static/ba.min.js' not in text:
              if anchor not in text:
                  raise SystemExit("Main inline script anchor not found")
              text = text.replace(anchor, loader + anchor, 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit patched index and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/opoong-kakao-ad-patch.yml
          git add -- index.html .github/workflows/opoong-kakao-ad-patch.yml
          git commit -m "Add Kakao AdFit placements"
          git push origin HEAD:main
