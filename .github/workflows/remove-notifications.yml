name: Remove notification feature

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-notifications.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove notification code and files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace('\n<script src="./push-notifications.js?v=20260821-3" defer></script>', '')
          text = text.replace('<script src="./push-notifications.js?v=20260821-3" defer></script>\n', '')
          index.write_text(text, encoding="utf-8")

          sw = Path("service-worker.js")
          text = sw.read_text(encoding="utf-8")
          text = text.replace('const CACHE_VERSION = "v54";', 'const CACHE_VERSION = "v55";')
          text = text.replace('  "./pwa-update.js",\n  "./push-notifications.js"\n', '  "./pwa-update.js"\n')
          text = text.replace('      if (!html.includes("push-notifications.js")) tags.push(\'<script src="./push-notifications.js?v=20260821-3" defer></script>\');\n', '')
          text = text.replace('    "/push-notifications.js",\n', '')
          marker = '\n\nself.addEventListener("push",'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          sw.write_text(text, encoding="utf-8")
          PY

          rm -f cloudflare-fcm-worker.js
          rm -f fcm-notifications.js
          rm -f firebase-messaging-sw.js
          rm -f push-notifications.js

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "Remove notification feature"
          git push
