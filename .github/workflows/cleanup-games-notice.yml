name: One-time O.Poong cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-games-notice.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove mini-game entry points and hide current notice
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # 1) Turn off the current notice banner.
          text, notice_count = re.subn(
              r'(const NOTICE_CONFIG\s*=\s*\{\s*\n\s*)enabled:\s*true,',
              r'\1enabled: false,',
              text,
              count=1,
          )
          if notice_count == 0 and not re.search(
              r'const NOTICE_CONFIG\s*=\s*\{.*?enabled:\s*false,', text, re.S
          ):
              raise SystemExit('NOTICE_CONFIG enabled flag was not found')

          # When notices are disabled, remove the banner from layout entirely.
          banner_marker = 'function renderNoticeBanner(){\n  const box = $("#noticeBanner");\n  if(!box) return;\n'
          banner_guard = (
              banner_marker
              + '  if(!NOTICE_CONFIG.enabled){\n'
              + '    box.hidden = true;\n'
              + '    box.style.display = "none";\n'
              + '    return;\n'
              + '  }\n'
          )
          if 'box.hidden = true;' not in text:
              if banner_marker not in text:
                  raise SystemExit('renderNoticeBanner marker was not found')
              text = text.replace(banner_marker, banner_guard, 1)

          # Keep the class Now Bar full-width when the notice is hidden.
          old_grid_toggle = 'grid.classList.toggle("hasNowBar", visible);'
          new_grid_toggle = 'grid.classList.toggle("hasNowBar", visible && NOTICE_CONFIG.enabled);'
          if old_grid_toggle in text:
              text = text.replace(old_grid_toggle, new_grid_toggle, 1)

          # 2) Remove mini-game navigation button.
          text, nav_count = re.subn(
              r'\n\s*<a class="navBtn" data-view="game"[^>]*>.*?</a>',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if nav_count != 1 and 'data-view="game"' in text:
              raise SystemExit('Mini-game navigation could not be removed safely')

          # 3) Remove the entire mini-game view, stopping at the next top-level view section.
          text, view_count = re.subn(
              r'\n\s*<section class="section view" id="view-game">.*?(?=\n\s*<section class="section view" id="view-[^"]+">)',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if view_count != 1 and 'id="view-game"' in text:
              raise SystemExit('Mini-game view could not be removed safely')

          # 4) Remove the game-over advertising/restart modal that belonged only to games.
          text, _ = re.subn(
              r'\n<div id="gameOverAdBack" class="gameOverAdBack".*?(?=\n<script>)',
              '\n',
              text,
              count=1,
              flags=re.S,
          )

          # 5) Remove mini-games from global search.
          text, _ = re.subn(
              r'\n\s*\{title:"미니게임"[^\n]*\},?',
              '',
              text,
              count=1,
          )

          # 6) If an old bookmarked ?page=game URL is opened, send it to Home instead.
          go_marker = 'function go(view){\n'
          go_guard = '  if(view === "game") view = "home";\n'
          if go_guard not in text:
              if go_marker not in text:
                  raise SystemExit('go(view) route function was not found')
              text = text.replace(go_marker, go_marker + go_guard, 1)

          # Remove now-unreachable game initialization hooks.
          text = text.replace('  if(view === "game") showMiniGameHub();\n', '', 1)
          text = text.replace('  initOpoongGame();\n', '', 1)

          # Safety checks: user-facing game entry points must be gone.
          if 'data-view="game"' in text:
              raise SystemExit('Game nav still exists after cleanup')
          if 'id="view-game"' in text:
              raise SystemExit('Game view still exists after cleanup')
          if '{title:"미니게임"' in text:
              raise SystemExit('Game search entry still exists after cleanup')
          if not re.search(r'const NOTICE_CONFIG\s*=\s*\{.*?enabled:\s*false,', text, re.S):
              raise SystemExit('Notice was not disabled')
          if text == original:
              raise SystemExit('No changes were made')

          path.write_text(text, encoding='utf-8')
          print('O.Poong cleanup checks passed.')
          PY

      - name: Commit cleanup and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-games-notice.yml
          git add index.html
          git commit -m "Remove O.Poong mini games and current notice"
          git pull --rebase origin main
          git push origin HEAD:main
