<script>
function opoongLogoFallback(img){
  try{
    const list = String(img.getAttribute("data-logo-fallbacks") || "").split("|").filter(Boolean);
    const idx = Number(img.getAttribute("data-logo-index") || "0");
    if(idx < list.length){
      img.setAttribute("data-logo-index", String(idx + 1));
      img.src = list[idx];
      return;
    }
  }catch(e){}
  img.style.display = "none";
  if(img.parentElement) img.parentElement.classList.add("logo-failed");
}
</script>

<style>
:root{
  --bg:#f5f7fb;
  --bg2:#edf4ff;
  --card:#ffffff;
  --card2:#f8fbff;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --line2:#dbeafe;
  --pri:#1e40af;
  --pri2:#2563eb;
  --pri3:#60a5fa;
  --ok:#059669;
  --warn:#b91c1c;
  --amber:#d97706;
  --shadow:0 22px 60px rgba(15,23,42,.10);
  --shadow2:0 12px 28px rgba(15,23,42,.08);
  --glass:rgba(255,255,255,.78);
  --radius:28px;
  --radius2:20px;
  --max:1180px;
}
html[data-theme="dark"]{
  --bg:#07111f;
  --bg2:#0b1730;
  --card:#0f172a;
  --card2:#111c31;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --line:#26364d;
  --line2:#1e3a5f;
  --pri:#60a5fa;
  --pri2:#2563eb;
  --pri3:#93c5fd;
  --ok:#10b981;
  --warn:#f87171;
  --amber:#fbbf24;
  --shadow:0 24px 70px rgba(0,0,0,.42);
  --shadow2:0 14px 34px rgba(0,0,0,.28);
  --glass:rgba(15,23,42,.76);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(900px 420px at 8% -8%, color-mix(in srgb, var(--pri3) 32%, transparent), transparent 60%),
    radial-gradient(850px 420px at 100% 0%, color-mix(in srgb, var(--ok) 15%, transparent), transparent 58%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;
  word-break:keep-all;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(color-mix(in srgb, var(--pri) 7%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--pri) 7%, transparent) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom, rgba(0,0,0,.55), transparent 72%);
}
a{color:inherit}
.navBtn{text-decoration:none}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:4px solid color-mix(in srgb, var(--pri3) 45%, transparent);
  outline-offset:3px;
}
.skip{
  position:absolute;left:-999px;top:10px;z-index:9999;
  padding:10px 14px;border-radius:999px;background:var(--pri);color:#fff;font-weight:900;
}
.skip:focus{left:12px}
.wrap{max-width:var(--max);margin:0 auto;padding:18px 14px 42px;position:relative;z-index:1}
.topbar{
  position:sticky;top:12px;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px;
  border:1px solid color-mix(in srgb,var(--line) 84%,transparent);
  border-radius:30px;
  background:var(--glass);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow2);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logoWrap{
  width:58px;height:58px;border-radius:21px;overflow:hidden;flex:0 0 auto;
  border:1px solid color-mix(in srgb,var(--pri) 24%,var(--line));
  background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 12%,var(--card)),var(--card));
  box-shadow:0 14px 28px rgba(15,23,42,.12);
}
.logo{width:100%;height:100%;display:block;object-fit:cover}
.brandText{display:flex;flex-direction:column;min-width:0}
.brandText b{font-size:19px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandText span{font-size:12.5px;color:var(--muted);font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn,.navBtn,.smallbtn,.bigBtn,.tabBtn{
  position:relative;overflow:hidden;
  border:0;border-radius:18px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:950;letter-spacing:-.2px;
  transition:transform .16s ease, box-shadow .18s ease, opacity .18s ease, background .18s ease, border-color .18s ease;
  user-select:none;white-space:nowrap;
}
.btn{padding:12px 14px;font-size:14px;background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:0 8px 18px rgba(15,23,42,.05)}
.btn.primary,.btn.ok,.smallbtn.primary,.bigBtn{
  color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));
  box-shadow:0 14px 28px color-mix(in srgb,var(--pri) 26%,transparent);
}
.btn.ok{background:linear-gradient(135deg,var(--ok),color-mix(in srgb,var(--ok) 72%,#000))}
.btn.ghost,.smallbtn.ghost{background:color-mix(in srgb,var(--card) 88%,transparent);color:var(--text);border:1px solid var(--line);box-shadow:0 8px 18px rgba(15,23,42,.05)}
.btn:hover,.navBtn:hover,.smallbtn:hover,.bigBtn:hover,.tabBtn:hover{transform:translateY(-2px);opacity:.97}
.btn:active,.navBtn:active,.smallbtn:active,.bigBtn:active,.tabBtn:active{transform:translateY(1px)}
.ripple{
  position:absolute;border-radius:50%;transform:scale(0);animation:ripple .55s linear;
  background:rgba(255,255,255,.42);pointer-events:none;
}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.hero{
  margin-top:18px;
  display:grid;grid-template-columns:1.12fr .88fr;gap:16px;align-items:stretch;
}
.heroCard,.sideCard,.panel,.modal,.infoCard{
  border:1px solid color-mix(in srgb,var(--line) 86%,transparent);
  border-radius:var(--radius);
  background:color-mix(in srgb,var(--card) 96%,transparent);
  box-shadow:var(--shadow);
}
.heroCard{padding:26px;overflow:hidden;position:relative}
.heroCard::after{
  content:"";
  position:absolute;right:-80px;top:-80px;width:220px;height:220px;border-radius:70px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--pri3) 45%,transparent),transparent);
  transform:rotate(20deg);
}
.kicker{

}
h1{margin:16px 0 0;font-size:clamp(32px,5vw,58px);line-height:1.04;letter-spacing:-2px}
.heroText{margin:16px 0 0;color:var(--muted);font-size:16px;line-height:1.85;font-weight:750;max-width:680px}
.heroActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.bigBtn{padding:15px 18px;min-height:54px;font-size:15.5px}
.sideCard{padding:16px;display:flex;flex-direction:column;gap:12px}
.statusRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statusCard{
  min-height:112px;border:1px solid var(--line);border-radius:22px;padding:14px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,transparent),color-mix(in srgb,var(--pri) 5%,var(--card)));
  box-shadow:0 10px 22px rgba(15,23,42,.05);
}
.statusCard .label{font-size:12.5px;color:var(--muted);font-weight:900}
.statusCard .value{margin-top:10px;font-size:17px;line-height:1.55;font-weight:1000}
.noticeBanner{

  padding:14px;border-radius:22px;border:1px solid color-mix(in srgb,var(--pri) 20%,var(--line));
  background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 10%,var(--card)),color-mix(in srgb,var(--card) 94%,transparent));
}
.noticeBanner strong{display:block;font-size:15px}

.noticeBanner.empty{border-style:dashed;background:color-mix(in srgb,var(--card) 88%,transparent)}
.topNotice{
  margin-top:14px;
  box-shadow:var(--shadow2);
}
.homeWidgetHidden{display:none!important}

.layout{
  margin-top:16px;
  display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start;
}
.sideNav{
  position:sticky;top:98px;

.sideNavTitle{padding:8px 10px 12px;color:var(--muted);font-size:13px;font-weight:1000}
.navGrid{display:flex;flex-direction:column;gap:8px}
.navBtn{

}
.navBtn .left{display:flex;align-items:center;gap:10px;min-width:0}

}
.navBtn .title{font-size:14.5px;font-weight:1000}
.navBtn .hint{font-size:11.5px;color:var(--muted);font-weight:900;margin-top:2px}
.navBtn[data-active="1"]{
  border-color:color-mix(in srgb,var(--pri) 42%,var(--line));
  background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 14%,var(--card)),color-mix(in srgb,var(--card) 96%,transparent));
  box-shadow:0 12px 25px color-mix(in srgb,var(--pri) 12%,transparent);

.panel{overflow:hidden;min-height:560px}
.view{display:none;animation:viewIn .22s ease both}

.section{padding:18px}
.sectionHeader{
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;
}
.sectionHeader h2{margin:0;font-size:24px;letter-spacing:-.8px}
.sectionHeader p{margin:6px 0 0;color:var(--muted);font-weight:750;line-height:1.65}
.cardGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.toolCard{
  border:1px solid var(--line);border-radius:24px;padding:16px;background:color-mix(in srgb,var(--card) 94%,transparent);
  box-shadow:0 10px 22px rgba(15,23,42,.055);transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.toolCard:hover{transform:translateY(-3px);box-shadow:var(--shadow2);border-color:color-mix(in srgb,var(--pri) 35%,var(--line))}
.toolCard b{font-size:16px}
.toolCard p{margin:8px 0 14px;color:var(--muted);font-weight:750;line-height:1.7;font-size:14px}
.controls{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  padding:13px;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--card) 92%,transparent);
  box-shadow:var(--shadow2);
}
input[type="date"],input[type="month"],input[type="number"],input[type="text"],textarea{
  min-height:48px;padding:12px 13px;border-radius:16px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--card) 92%,transparent);color:var(--text);
  font-weight:850;
}
input[type="number"]{width:112px}
.smallbtn{min-height:48px;padding:12px 14px;font-size:14px}
.notice,.contentBox{
  margin-top:12px;padding:14px;border-radius:22px;border:1px solid var(--line);

  color:var(--muted);font-weight:800;line-height:1.8;
}
.notice.ok{border-color:color-mix(in srgb,var(--ok) 35%,var(--line));background:color-mix(in srgb,var(--ok) 10%,var(--card));color:color-mix(in srgb,var(--ok) 72%,var(--text))}
.notice.err{border-color:color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--card));color:color-mix(in srgb,var(--warn) 76%,var(--text))}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--pri) 8%,var(--card));border:1px solid color-mix(in srgb,var(--pri) 18%,var(--line));
  color:var(--muted);font-size:12px;font-weight:1000;
}
.widgetGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.widget{
  border:1px solid var(--line);border-radius:24px;padding:14px;background:color-mix(in srgb,var(--card) 94%,transparent);
  min-height:170px;box-shadow:0 10px 22px rgba(15,23,42,.055);
}
.widgetHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.widgetHead b{font-size:15px}
.widgetBody{color:var(--text);font-size:14px;line-height:1.75;max-height:250px;overflow:auto}
.muted{color:var(--muted);font-weight:850}
.mealTableWrap{margin-top:14px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--shadow2);overflow:auto}
.mealTable{width:100%;min-width:820px;border-collapse:separate;border-spacing:0}
.mealTable th,.mealTable td{border-bottom:1px solid var(--line);padding:12px;vertical-align:top;text-align:left}
.mealTable thead th{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--pri) 7%,var(--card));font-weight:1000}
.mealTable tr:last-child td{border-bottom:0}
.mealMenus{margin:0;padding-left:18px;line-height:1.75}
.ttWrap{overflow:auto;margin-top:14px}
.ttTable{width:100%;min-width:860px;border-collapse:separate;border-spacing:8px}
.ttTable th{padding:8px;text-align:left;color:var(--muted);font-size:13px}
.ttTable input{width:100%;min-width:120px}
.neisBox textarea{width:100%;min-height:380px;resize:vertical;line-height:1.7}
.tabBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabBtn{
  padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--muted);
  font-size:13px;border-radius:999px;
}
.tabBtn[aria-selected="true"]{color:var(--text);border-color:color-mix(in srgb,var(--pri) 45%,var(--line));background:color-mix(in srgb,var(--pri) 11%,var(--card))}
.progress{height:12px;border-radius:999px;background:color-mix(in srgb,var(--pri) 7%,var(--card));border:1px solid var(--line);overflow:hidden;margin-top:12px}
.progress>div{height:100%;width:0%;background:linear-gradient(135deg,var(--pri),var(--pri2));transition:width .16s ease}
.progress>div.over{background:linear-gradient(135deg,var(--warn),#7f1d1d)}
.footer{
  margin-top:18px;padding:18px;border-radius:28px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--card) 82%,transparent);color:var(--muted);font-weight:750;line-height:1.8;font-size:13.5px;
}
.footerLinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.footerLinks button{font-size:13px}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.46);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{width:min(720px,100%);overflow:hidden;background:var(--card)}
.modalHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--pri) 6%,var(--card))}
.modalHead b{font-size:17px}
.modalBody{padding:16px;color:var(--muted);font-weight:800;line-height:1.8}
.modalFoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line)}
#shareText,#copyHelper{position:absolute;left:-9999px;top:-9999px;opacity:0;width:1px;height:1px}
@media (max-width:960px){
  .hero,.layout{grid-template-columns:1fr}
  .sideNav{position:relative;top:auto}
  .navGrid{display:grid;grid-template-columns:repeat(2,1fr)}
  .widgetGrid,.cardGrid{grid-template-columns:1fr}
}
@media (max-width:620px){
  .wrap{padding:12px 10px 34px}
  .topbar{align-items:flex-start}
  .actions{gap:6px}
  .btn{padding:10px 11px}
  .heroCard{padding:20px}
  .statusRow,.navGrid{grid-template-columns:1fr}
  .controls{align-items:stretch}
  .controls>*{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}

/* ===== O.Poong added: allergy highlight + first setup modal ===== */
.allergyPanel{
  margin-top:12px;
  padding:14px;
  border-radius:22px;
  border:1px solid color-mix(in srgb,var(--warn) 18%,var(--line));
  background:color-mix(in srgb,var(--warn) 5%,var(--card));
}
.allergyGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}
.allergyChip{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 10px;
  border-radius:999px;
  border:1px solid color-mix(in srgb,var(--line) 90%,transparent);
  background:color-mix(in srgb,var(--card) 92%,transparent);
  color:var(--text);
  font-size:12.5px;
  font-weight:950;
}
.allergyChip input{min-height:auto}
.allergyHit{
  color:color-mix(in srgb,var(--warn) 86%,var(--text));
  font-weight:1000;
  background:color-mix(in srgb,var(--warn) 13%,var(--card));
  border:1px solid color-mix(in srgb,var(--warn) 34%,var(--line));
  border-radius:14px;
  padding:7px 9px;
  margin:4px 0;
  list-style-position:inside;
}
.allergySafe{padding:3px 0}
.allergyWarnText{
  margin-top:10px;
  color:color-mix(in srgb,var(--warn) 78%,var(--text));
  font-size:12.5px;
  font-weight:950;
}
.setupStep{display:none}
.setupStep.active{display:block}
.setupGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}
.setupOption{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 11px;
  border-radius:999px;
  border:1px solid var(--line);
  background:color-mix(in srgb,var(--card) 92%,transparent);
  color:var(--text);
  font-size:13px;
  font-weight:950;
}
.setupOption input{min-height:auto}
@media (max-width:620px){
  .allergyGrid,.setupGrid{grid-template-columns:1fr 1fr}
}


/* ===== O.Poong added: first start gate ===== */
body.setup-pending .wrap{
  display:none;
}
.firstStartBack{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:stretch;
  justify-content:center;
  padding:18px;
  background:
    radial-gradient(900px 420px at 8% -8%, color-mix(in srgb, var(--pri3) 32%, transparent), transparent 60%),
    radial-gradient(850px 420px at 100% 0%, color-mix(in srgb, var(--ok) 15%, transparent), transparent 58%),
    linear-gradient(180deg,var(--bg2),var(--bg));
}
body.setup-pending .firstStartBack{
  display:flex;
}
.firstStartCard{
  width:min(720px,100%);
  min-height:calc(100vh - 36px);
  display:flex;
  flex-direction:column;

function getHomeWidgetConfig(){
  try{
    const saved = JSON.parse(localStorage.getItem("opoong_home_widgets") || "{}");
    return {...HOME_WIDGET_CONFIG, ...saved};
  }catch{
    return {...HOME_WIDGET_CONFIG};
  }
}
function saveHomeWidgetConfig(cfg){
  localStorage.setItem("opoong_home_widgets", JSON.stringify(cfg));
}
function applyHomeWidgetConfig(){
  const cfg = getHomeWidgetConfig();
  $$("[data-home-widget]").forEach(el=>{
    const key = el.dataset.homeWidget;
    el.classList.toggle("homeWidgetHidden", cfg[key] === false);
  });
  $$("[data-widget-toggle]").forEach(input=>{
    input.checked = cfg[input.dataset.widgetToggle] !== false;
  });
}
function toggleWidgetSelector(){
  const box = $("#widgetSelector");
  if(!box) return;
  box.style.display = box.style.display === "none" ? "block" : "none";
  applyHomeWidgetConfig();
}
function initWidgetSelector(){
  $$("[data-widget-toggle]").forEach(input=>{
    input.addEventListener("change", ()=>{
      const cfg = getHomeWidgetConfig();
      cfg[input.dataset.widgetToggle] = input.checked;
      saveHomeWidgetConfig(cfg);
      applyHomeWidgetConfig();
    });
  });
  applyHomeWidgetConfig();
}


function weatherIconFor(item){
  const pty = String(item?.precipitationType || "없음");
  if(pty.includes("눈")) return "❄️";
  if(pty.includes("비")) return "🌧️";
  const sky = String(item?.sky || "");
  if(sky.includes("흐림")) return "☁️";
  if(sky.includes("구름")) return "⛅";
  return "☀️";
}

function weatherHourLabel(iso){
  const d = new Date(iso);
  if(Number.isNaN(d.getTime())) return "-";
  return `${pad2(d.getHours())}시`;
}

function weatherUpdatedLabel(iso){
  const d = new Date(iso);
  if(Number.isNaN(d.getTime())) return "업데이트 시각 없음";
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())} 업데이트`;
}

function renderWeatherAlertBanner(data){
  const banner = $("#weatherAlertBanner");
  if(!banner) return;

  const official = Array.isArray(data.officialWarnings) ? data.officialWarnings : [];
  const lifestyle = (Array.isArray(data.lifestyleAlerts) ? data.lifestyleAlerts : [])
    .filter(item=>item.severity === "danger" || item.severity === "warning");
  const alert = official[0] || lifestyle[0];

  if(!alert){
    banner.hidden = true;
    banner.innerHTML = "";
    banner.className = "noticeBanner topNotice weatherAlertBanner";
    return;
  }

  const isOfficial = Boolean(alert.official);
  const title = alert.title || "기상 안전 안내";
  const message = isOfficial
    ? `${alert.region || "안동"}에 기상청 공식 ${title}가 발표되었습니다. 최신 발표 내용을 확인해 주세요.`
    : (alert.message || "기상 상황에 유의해 주세요.");
  const level = alert.severity === "danger" || String(alert.level || "").includes("경보") ? "danger" : "warning";

  banner.hidden = false;
  banner.className = `noticeBanner topNotice weatherAlertBanner ${level}`;
  banner.innerHTML = `<div><strong>${isOfficial ? "기상청 공식 특보" : "O.Poong 생활 기상안내"} · ${escapeHtml(title)}</strong><p>${escapeHtml(message)}</p></div><button class="btn ghost" type="button" onclick="window.open('https://www.weather.go.kr/w/special-report/overall.do','_blank','noopener,noreferrer')">기상청 확인</button>`;
}

    const currentSky = hourly[0]?.sky || current.precipitationType || "날씨";

        <div><div class="weatherTemp">${escapeHtml(temp)}</div><div class="weatherMeta">${escapeHtml(currentSky)} · 습도 ${escapeHtml(humidity)} · 바람 ${escapeHtml(wind)}</div></div>
      </div>
      <div class="weatherHourly" aria-label="시간별 날씨">
        ${hourly.map(item=>`<div class="weatherHour"><span>${escapeHtml(weatherHourLabel(item.forecastAt))}</span><b>${weatherIconFor(item)} ${Number.isFinite(item.temperatureC) ? `${item.temperatureC}°` : "-"}</b><span>${escapeHtml(item.sky || item.precipitationType || "-")}</span></div>`).join("")}
      </div>
      <div class="weatherStatus">${escapeHtml(warningLine)} · ${escapeHtml(weatherUpdatedLabel(data.updatedAt))} · 출처 기상청</div>`;

    renderWeatherAlertBanner(data);

  }catch(err){

    status.textContent = "연결 오류";
    body.innerHTML = `<div class="muted">날씨 정보를 불러오지 못했어요. 잠시 후 다시 확인해 주세요.</div>`;
    const banner = $("#weatherAlertBanner");
    if(banner) banner.hidden = true;
    renderPersonalHeroLine();
  }
}

function weatherFullTimeLabel(iso){
  const d = new Date(iso);
  if(Number.isNaN(d.getTime())) return "시각 정보 없음";
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function weatherRiskSummary(data){
  const snapshot = weatherSnapshot(data);
  const official = Array.isArray(data.officialWarnings) ? data.officialWarnings : [];
  const lifestyle = (Array.isArray(data.lifestyleAlerts) ? data.lifestyleAlerts : [])
    .filter(item=>item.severity === "danger" || item.severity === "warning");
  if(official.length){
    return { level:"danger", title:official[0].title || "기상청 공식 특보 발표", message:`${official[0].region || "안동"}의 공식 발표 내용을 확인하고 안전수칙을 따라주세요.` };
  }
  if(lifestyle.length){
    return { level:lifestyle[0].severity || "warning", title:lifestyle[0].title || "생활 기상 주의", message:lifestyle[0].message || "기상 상황에 주의해 주세요." };
  }
  if(Number.isFinite(snapshot.feelsLike) && snapshot.feelsLike >= 33){
    return { level:"warning", title:"온열질환에 주의하세요", message:`현재 기온과 습도로 계산한 추정 체감온도는 ${snapshot.feelsLike}℃예요. 물을 자주 마시고 한낮 야외활동을 줄여주세요.` };
  }
  if(snapshot.hourly.slice(0,3).some(item=>Number(item.precipitationProbabilityPercent) >= 60 || String(item.precipitationType || "").includes("비"))){
    return { level:"warning", title:"가까운 시간에 비가 올 수 있어요", message:"우산을 준비하고 시간별 강수확률을 확인해 주세요." };
  }
  return { level:"normal", title:"현재 확인된 큰 기상 위험은 없어요", message:"날씨는 바뀔 수 있으니 등하교 전 최신 예보를 다시 확인해 주세요." };
}

function renderWeatherAlertsList(data){
  const official = (Array.isArray(data.officialWarnings) ? data.officialWarnings : []).map(item=>({...item, official:true}));
  const lifestyle = Array.isArray(data.lifestyleAlerts) ? data.lifestyleAlerts : [];
  const alerts = [...official, ...lifestyle.filter(item=>item.id !== "normal")];
  if(!alerts.length){
    const statusText = data.warningsStatus === "available"
      ? "기상청 공식 특보가 없고, 현재 계산된 생활 기상 위험도 낮아요."
      : "생활 기상 위험은 낮지만 공식 특보 조회가 지연되고 있어요.";
    return `<div class="weatherAlertItem"><strong>현재 활성 안내 없음</strong><p>${escapeHtml(statusText)}</p></div>`;
  }
  return alerts.map(item=>{
    const level = item.severity === "danger" || String(item.level || "").includes("경보") ? "danger" : "warning";
    const message = item.message || (item.official ? `${item.region || "안동"}에 발표된 기상청 공식 특보입니다.` : "기상 상황에 주의해 주세요.");
    return `<div class="weatherAlertItem ${level}"><strong>${item.official ? "기상청 공식 특보 · " : "생활 기상안내 · "}${escapeHtml(item.title || "기상 안전 안내")}</strong><p>${escapeHtml(message)}</p></div>`;
  }).join("");
}

          </div>`).join("") || `<div class="muted">시간별 예보가 없습니다.</div>`}
        </div>
